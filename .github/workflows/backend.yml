name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHPUnit and MySQL migration smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: pharmacy_test
          MYSQL_ROOT_PASSWORD: pharmacy-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppharmacy-ci-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: curl, fileinfo, mbstring, openssl, pdo_mysql, pdo_sqlite, sqlite3, sodium, zip
          coverage: xdebug
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.5-composer-

      - name: Validate Composer files
        run: composer validate --strict --no-check-publish

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare local test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction

      - name: Verify migrations against MySQL
        run: timeout 110s php artisan migrate:fresh --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: pharmacy_test
          DB_USERNAME: root
          DB_PASSWORD: pharmacy-ci-password

      - name: Run Unit tests with coverage
        run: |
          mkdir -p storage/framework/cache/coverage
          timeout 110s php artisan test --compact --coverage-clover=storage/framework/cache/coverage/unit.xml --testsuite=Unit

      - name: Run Architecture tests with coverage
        run: timeout 110s php artisan test --compact --coverage-clover=storage/framework/cache/coverage/architecture.xml --testsuite=Architecture

      - name: Run Feature foundation tests with coverage
        run: timeout 110s php artisan test --compact --coverage-clover=storage/framework/cache/coverage/feature-foundation.xml --testsuite=FeatureFoundation

      - name: Run Feature business tests with coverage
        run: timeout 110s php artisan test --compact --coverage-clover=storage/framework/cache/coverage/feature-business.xml --testsuite=FeatureBusiness

      - name: Run Feature transport tests with coverage
        run: timeout 110s php artisan test --compact --coverage-clover=storage/framework/cache/coverage/feature-transport.xml --testsuite=FeatureTransport

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/storage/framework/cache/coverage/*.xml
          if-no-files-found: ignore

  static-analysis:
    name: PHPStan level 9
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: curl, fileinfo, mbstring, openssl, pdo_mysql, pdo_sqlite, sqlite3, sodium, zip
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.5-composer-

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare local test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction

      - name: Run PHPStan
        run: timeout 110s composer run analyse
